on:
  push:
    branches:
      - main
      - master

name: bookdown

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install tinytex
        uses: r-lib/actions/setup-tinytex@v2

      - name: Setup pandoc
        uses: r-lib/actions/setup-pandoc@v2
        
      - name: Cache bookdown results
        uses: actions/cache@v4
        with:
          path: _bookdown_files
          key: ${{ runner.os }}-bookdown-4-${{ hashFiles('**/*Rmd') }}
          restore-keys: ${{ runner.os }}-bookdown-4-

      - name: Install R and Linux system dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: deps::.
          upgrade: 'TRUE'

      - name: Build site
        run: |
          Rscript -e 'bookdown::render_book("index.Rmd", "bookdown::gitbook", quiet = TRUE)'
          Rscript -e 'bookdown::render_book("index.Rmd", "bookdown::pdf_book", quiet = TRUE)'

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN}}
          publish_dir: ./_book
          cname: book.stat420.org
